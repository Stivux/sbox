[tools]
go = "latest"
golangci-lint = "latest"

[tasks.fmt]
run = ["golangci-lint fmt"]

[tasks.lint]
depends = ["fmt"]
run = ["golangci-lint run ./..."]

[tasks.build]
depends = ["fmt", "lint"]

run = [
  "go build ./...",
  "go build -tags $LX_TAGS -o $EXECUTABLE_NAME ./cmd/$PROJECT_NAME/main.go"
]

[tasks.build.env]
PROJECT_NAME = "{{ config_root | basename }}"
EXECUTABLE_NAME = "{{ env.PROJECT_NAME }}{% if os() == 'windows' %}.exe{% endif %}"
LX_TAGS = "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_xhttp,with_awg,with_lx_command"

[tasks.release]
run = [
  { task = "build", env = { CGO_ENABLED = "0", GOFLAGS = "-trimpath -ldflags=-s -w" } },
]
